name: Refresh platform stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Refresh Codeforces users
        run: |
          curl -fsS -X POST "${{ secrets.BACKEND_URL }}/api/sync/cron/resync-all" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Refresh LeetCode users
        run: |
          curl -fsS -X POST "${{ secrets.BACKEND_URL }}/api/sync/cron/resync-all-leetcode" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Refresh CodeChef users
        run: |
          curl -fsS -X POST "${{ secrets.BACKEND_URL }}/api/sync/cron/resync-all-codechef" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
